[build-system]
requires = [ "hatchling>=1.25" ]
build-backend = "hatchling.build"

[project]
name = "deviation-station"
version = "0.1.0"
description = "A GNU Radio FM deviation instrument for bench work, repeaters, and sound-card modem calibration."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = [ "amateur-radio", "bessel", "deviation", "fm", "gnuradio", "soapysdr" ]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Telecommunications Industry",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Ham Radio",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
gui = [
  "PyQt6>=6.6",
]
sdr = [
  "SoapySDR>=0.8",
]
test = [
  "pytest>=8.0",
  "PyQt6>=6.6",
]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "scipy>=1.11",
  "PyQt6>=6.6",
]

[project.urls]
Homepage = "https://github.com/ben-kuhn/deviation-station"
Repository = "https://github.com/ben-kuhn/deviation-station"
Issues = "https://github.com/ben-kuhn/deviation-station/issues"

[project.scripts]
devstation = "deviation_station.cli:main"

[tool.hatch.build.targets.wheel]
packages = [ "src/deviation_station" ]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = [ "tests" ]
pythonpath = [ "src" ]
